{% extends 'base.html' %}

{% block title %}ユーザー登録{% endblock %}

{% block h2 %}
    <h2>
        ユーザー登録画面
    </h2>
{% endblock %}

{% block content %}
    <form method="POST">

        <p>
            名前：
            <input type="text" 
                   name="user_name" 
                   value="{{ user_name }}">
        </p>

        <button type="submit">
            登録
        </button>

    </form>
    
        <a href="{{ url_for('master_user_preview')}}">
            ユーザー表示画面へ
        </a>
        <br>
{% endblock %}

{% block footer %}
    <a href="{{ url_for('master_top')}}">
        マスタTOP画面へ
    </a>
    <br>
    {{super()}}
{% endblock %}
