{% extends 'base.html' %}

{% block title %}費目登録{% endblock %}

{% block h2 %}
    <h2>
        費目登録画面
    </h2>
{% endblock %}

{% block content %}
<form method="POST" class="edit-form">

    <div class="form-row">
        <label>費目名</label>
        <input type="text"
               name="category_name"
               value="{{ category_name }}">
    </div>

    <div class="form-row">
        <label>収支区分</label>

        <select name="transaction_type">
            <option value="expense">
                支出
            </option>

            <option value="income">
                収入
            </option>
        </select>
    </div>

    <div class="form-button">
        <button type="submit">
            登録
        </button>
    </div>

</form>
    <a href="{{ url_for('master_category_preview')}}">
        費目表示画面へ
    </a>
    <br>
{% endblock %}

{% block footer %}
    <a href="{{ url_for('master_top')}}">
        マスタTOP画面へ
    </a>
    <br>
    {{super()}}
{% endblock %}
