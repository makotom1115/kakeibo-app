<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style.css')}}">
    <title>
        {% block title %}
        タイトル
        {% endblock %}
    </title>
</head>
<body>
    <div class="container">
        <header>
            <h1>
                家計簿アプリ
            </h1>
        </header>
        <hr>
    {% block h2 %}
        h2
    {% endblock %}

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="flash-message">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

        <div class="content-container">
            {% block content %}
                内容
            {% endblock %}
        </div>

    <hr>

        <div class="footer-container">
            {% block footer %}
                <a href="{{ url_for('top')}}">
                    家計簿TOP画面へ
                </a>
            {% endblock %}
        </div>
    </div>
</body>
</html>
